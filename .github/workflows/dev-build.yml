name: Dev Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  dev-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set build metadata
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build site
        run: make build-site

      - name: Build binaries
        env:
          CGO_ENABLED: 0
          GOOS: linux
        run: |
          LDFLAGS="-s -w \
            -X 'github.com/cvhariharan/flowctl/cmd.version=dev-${{ steps.vars.outputs.short_sha }}' \
            -X 'github.com/cvhariharan/flowctl/cmd.commit=${{ steps.vars.outputs.short_sha }}' \
            -X 'github.com/cvhariharan/flowctl/cmd.date=${{ steps.vars.outputs.date }}'"
          for arch in amd64 arm64; do
            GOARCH=$arch go build -ldflags="$LDFLAGS" -o dist/linux_$arch/flowctl
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cvhariharan/flowctl:dev
            ghcr.io/cvhariharan/flowctl:dev-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
